# Configuração de lint e testes do btc-mood-tracker.

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,venv,cache,deploy
# E402 (import fora do topo) é proposital: os scripts e o dashboard inserem
# a pasta `scripts/` no sys.path ANTES de importar os módulos do projeto.
per-file-ignores =
    dashboard.py:E402
    scripts/*.py:E402
    tests/*.py:E402

[tool:pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
