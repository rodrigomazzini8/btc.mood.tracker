name: CI

# Roda em todo push e em todo pull request. A suíte é OFFLINE de propósito
# (nenhum teste acessa a rede), então não depende das APIs externas estarem
# de pé nem gasta cota de nenhuma delas.
on:
  # `push` só na branch principal: numa branch de PR o evento `pull_request`
  # já cobre, e os dois juntos rodariam a suíte inteira duas vezes.
  push:
    branches: [main]
    # O commit diário de dados não mexe em código: não precisa rodar a suíte.
    paths-ignore: ["data/**", "**/*.md"]
  pull_request:

# Push novo na mesma branch cancela a execução anterior (que já está obsoleta).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Testes (pytest, sem rede)
        run: pytest

      - name: Autoteste do Cycle Model
        run: python scripts/cycle_model.py --autoteste

      - name: Dashboard importa sem erro
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('dashboard.py').read_text())"
